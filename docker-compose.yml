# Staging / production stack (ADR-004). Coolify deploys this file; set the domain on `web`.
# Local check: SECRET_KEY=local docker compose up --build
services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-staging}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      DEMO_MODE: ${DEMO_MODE:-true}
      TOKEN_TTL_MINUTES: ${TOKEN_TTL_MINUTES:-720}
    volumes:
      - autocare-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  web:
    build: ./frontend
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "80"
    restart: unless-stopped

volumes:
  autocare-data:
